<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 기록 — ABC 돌봄 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 히어로 영상에서 추출한 팔레트 */
  --sky:#BBCAB7; --band:#85A484; --card-soft:#CDDAC8;
  --bg:#EFF3EC; --card:#FFFFFF;
  --sage:#43604F; --sage-mid:#7E9584; --sage-soft:#E3EAE2; --sage-line:#C8D4C7;
  --ink:#33443A; --muted:#7B837C; --line:#E0E5DC;
  --dusk:#B0762F; --dusk-soft:#F6EBDC;
  --radius:16px;
  --disp:'Gowun Dodum','Pretendard',sans-serif;
  --body:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#E4E7DF;font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0;}
@media (max-width:480px){body{padding:0;}}

.phone{width:390px;max-width:100vw;height:800px;max-height:100vh;background:var(--band);border-radius:34px;box-shadow:0 24px 60px rgba(51,68,58,.22);overflow:hidden;position:relative;display:flex;flex-direction:column;}
@media (max-width:480px){.phone{border-radius:0;height:100vh;box-shadow:none;}}

.view{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;}
.view::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}

/* ===== HERO HOME ===== */
#view-home{background:var(--band);}
.hero{position:relative;width:100%;aspect-ratio:1080/1920;background:var(--sky);overflow:hidden;}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

/* 히어로 위 글자 */
.hero-copy{position:absolute;top:3.8%;left:0;right:0;text-align:center;z-index:2;animation:fadeDown 1.1s ease .2s both;}
.hero-copy .date{font-size:12px;color:var(--sage);opacity:.75;letter-spacing:.04em;margin-bottom:6px;}
.hero-copy h1{font-family:var(--disp);font-size:25px;color:var(--sage);line-height:1.4;text-shadow:0 1px 0 rgba(255,255,255,.35);}
.hero-copy .tag{font-size:12.5px;color:var(--ink);opacity:.68;margin-top:7px;line-height:1.55;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* 영상 속 빈 카드 3자리에 겹치는 메뉴 */
.slot{position:absolute;z-index:2;top:79%;height:18.4%;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-family:var(--body);border-radius:22px;transition:transform .12s ease;}
.slot:active{transform:scale(.96);}
.slot .ico{width:40px;height:40px;border-radius:50%;background:var(--sage);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(67,96,79,.25);}
.slot .ico.soft{background:#fff;color:var(--sage);box-shadow:0 3px 8px rgba(51,68,58,.14);}
.slot .lb{font-size:12.5px;font-weight:700;color:var(--sage);}
.slot .sb{font-size:10.5px;color:var(--muted);margin-top:-4px;}
.slot-1{left:4.5%;width:27%;}
.slot-2{left:36.5%;width:27%;}
.slot-3{left:68.5%;width:27%;}

/* 스크롤 힌트 & 아래 섹션 */
.scroll-hint{text-align:center;padding:10px 0 2px;color:#fff;font-size:11px;opacity:.85;letter-spacing:.05em;}
.scroll-hint span{display:inline-block;animation:bob 1.8s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.home-below{background:var(--bg);border-radius:26px 26px 0 0;margin-top:6px;padding:22px 20px 40px;min-height:220px;}

.sec-label{font-size:12px;font-weight:700;color:var(--sage);letter-spacing:.08em;margin:22px 0 10px;}
.sec-label:first-child{margin-top:0;}

/* ===== 내부 페이지 공통 ===== */
.page{background:var(--bg);min-height:100%;padding:18px 20px 40px;}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--sage);cursor:pointer;font-family:var(--body);}
.h-date{font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:4px;}
.h-title{font-family:var(--disp);font-size:23px;line-height:1.35;margin-bottom:18px;}

/* record cards */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.rcard:active{border-color:var(--sage-line);}
.rcard .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.rcard .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rcard .result{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--sage-soft);color:var(--sage);white-space:nowrap;}
.rcard .result.warn{background:var(--dusk-soft);color:var(--dusk);}
.rcard .bline{font-size:14.5px;font-weight:600;line-height:1.45;}
.rcard .aline{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.detail{border-top:1px dashed var(--line);margin-top:11px;padding-top:11px;display:none;}
.rcard.open .detail{display:block;}
.d-row{display:flex;gap:9px;margin-bottom:8px;font-size:12.5px;line-height:1.55;}
.d-row:last-child{margin-bottom:0;}
.d-key{flex:0 0 34px;font-weight:700;color:var(--sage);font-variant-numeric:tabular-nums;}
.d-val{color:var(--ink);}

.cond-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.cond-card .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.cond-card .lbl{font-size:12px;color:var(--muted);}
.mini-chip{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--sage-soft);color:var(--sage);}
.mini-chip.me{background:var(--dusk-soft);color:var(--dusk);}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 0;line-height:1.6;}

/* ===== record flow overlay ===== */
.flow{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;}
.flow-head{padding:18px 20px 12px;}
.flow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.flow-close{background:none;border:none;font-size:14px;color:var(--muted);cursor:pointer;padding:4px;font-family:var(--body);}
.steps{display:flex;align-items:center;gap:6px;}
.step-dot{font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 10px;transition:all .2s;}
.step-dot.now{color:#fff;background:var(--sage);border-color:var(--sage);}
.step-dot.done{color:var(--sage);border-color:var(--sage-line);background:var(--sage-soft);}
.flow-q{font-family:var(--disp);font-size:20px;line-height:1.45;}
.flow-q em{font-style:normal;color:var(--sage);}
.flow-hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;}
.flow-body{flex:1;overflow-y:auto;padding:6px 20px 20px;scrollbar-width:none;}
.flow-body::-webkit-scrollbar{display:none;}
.flow-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px;}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;font-family:var(--body);cursor:pointer;}
.btn-primary{background:var(--sage);color:#fff;}
.btn-primary:disabled{background:#C6CEC6;cursor:default;}
.btn-ghost{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--muted);padding:15px 18px;}

.cat{margin-bottom:20px;}
.cat-name{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.cat-name::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--sage-mid);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:var(--body);font-size:13px;line-height:1.4;padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .12s;text-align:left;}
.chip:active{transform:scale(.97);}
.chip.sel{background:var(--sage);border-color:var(--sage);color:#fff;}
.chip.more{color:var(--sage);border-style:dashed;background:var(--sage-soft);border-color:var(--sage-line);font-weight:600;}
.chip.always{border-color:var(--sage-line);background:#FBFAF6;color:var(--sage);font-weight:600;}
.chip.always.sel{background:var(--sage);color:#fff;}
.chip.dusk.sel{background:var(--dusk);border-color:var(--dusk);}
.single-note{font-size:12px;color:var(--muted);margin:-4px 0 10px;}
.calm-block{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line);}
.calm-title{font-size:13px;font-weight:700;margin-bottom:9px;}

.tag-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.tag-sec h4{font-size:13.5px;margin-bottom:4px;}
.tag-sec p{font-size:12px;color:var(--muted);margin-bottom:11px;line-height:1.5;}
.opt-skip{font-size:12px;color:var(--muted);}

.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center;}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--sage-soft);color:var(--sage);font-size:28px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop .4s ease;}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.done-title{font-family:var(--disp);font-size:20px;margin-bottom:9px;}
.done-msg{font-size:13.5px;color:var(--muted);line-height:1.65;margin-bottom:22px;}
.done-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:30px;}

/* ===== report ===== */
.rep-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:12px;}
.rep-card h3{font-size:14px;margin-bottom:13px;display:flex;align-items:center;gap:7px;}
.rep-card h3 .n{font-size:10.5px;font-weight:700;color:var(--sage);background:var(--sage-soft);border-radius:6px;padding:2px 7px;letter-spacing:.03em;}
.top3{display:flex;flex-direction:column;gap:9px;}
.top3 .row{display:flex;align-items:center;gap:10px;}
.top3 .rank{flex:0 0 20px;font-family:var(--disp);font-size:15px;color:var(--sage-mid);}
.top3 .name{flex:1;font-size:13.5px;font-weight:600;}
.top3 .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.top3 .bar{height:5px;border-radius:99px;background:var(--sage-soft);flex:0 0 84px;overflow:hidden;}
.top3 .bar i{display:block;height:100%;background:var(--sage-mid);border-radius:99px;}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.chain:last-child{margin-bottom:0;}
.chain .node{font-size:12.5px;padding:7px 12px;border-radius:99px;line-height:1.35;}
.chain .a-node{background:var(--dusk-soft);color:var(--dusk);}
.chain .b-node{background:var(--sage);color:#fff;font-weight:600;}
.chain .arrow{color:var(--sage-mid);font-size:13px;}
.chain .times{font-size:11.5px;color:var(--muted);}
.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-list .row{display:flex;align-items:center;gap:10px;font-size:13px;}
.rank-list .medal{flex:0 0 22px;text-align:center;}
.rank-list .nm{flex:1;font-weight:600;}
.rank-list .eff{font-size:11.5px;color:var(--sage);background:var(--sage-soft);padding:3px 8px;border-radius:99px;white-space:nowrap;}
.dist{display:flex;align-items:flex-end;gap:14px;height:110px;padding:4px 6px 0;}
.dist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.dist .bar-v{width:26px;border-radius:8px 8px 3px 3px;background:var(--sage-soft);}
.dist .bar-v.hot{background:linear-gradient(180deg,var(--dusk) 0%,#D8A15F 100%);}
.dist .bar-v.mid{background:var(--sage-mid);}
.dist .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.dist .lab{font-size:11px;color:var(--muted);}
.dist-note{font-size:12px;color:var(--dusk);margin-top:10px;line-height:1.55;}
.selfcare{background:var(--dusk-soft);border:1px solid #ECD9BF;border-radius:var(--radius);padding:15px 16px;margin-bottom:12px;}
.selfcare h4{font-size:13.5px;color:var(--dusk);margin-bottom:5px;}
.selfcare p{font-size:12.5px;color:#7A5A2E;line-height:1.6;}
.selfcare button{margin-top:10px;background:#fff;border:1px solid #ECD9BF;color:var(--dusk);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--body);}
.share-btn{display:block;width:100%;background:#fff;border:1.5px solid var(--sage);color:var(--sage);border-radius:14px;padding:15px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--body);margin-top:4px;}

/* share overlay */
.share{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;}
.share-head{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
.share-head b{font-family:var(--disp);font-size:17px;}
.share-body{flex:1;overflow-y:auto;padding:4px 20px 28px;}
.paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 8px 20px rgba(51,68,58,.06);}
.paper .p-head{border-bottom:2px solid var(--sage);padding-bottom:12px;margin-bottom:15px;}
.paper .p-head h2{font-family:var(--disp);font-size:17px;margin-bottom:3px;}
.paper .p-head span{font-size:11.5px;color:var(--muted);}
.p-sec{margin-bottom:15px;}
.p-sec h5{font-size:11px;letter-spacing:.07em;color:var(--sage);margin-bottom:7px;}
.p-sec ul{list-style:none;}
.p-sec li{font-size:12.5px;line-height:1.7;padding-left:13px;position:relative;}
.p-sec li::before{content:'·';position:absolute;left:2px;color:var(--sage-mid);font-weight:700;}
.p-foot{border-top:1px dashed var(--line);padding-top:10px;font-size:10.5px;color:var(--muted);line-height:1.6;}
</style>
</head>

  list.forEach(k=>m[k]=(m[k]||0)+1);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

    const cls = k===hotKey&&v>0 ? 'hot' : (v>0?'mid':'');
    return `<div class="col"><span class="num">${v}</span>
      <div class="bar-v ${cls}" style="height:${Math.max(8, Math.round(v/bmax*72))}px"></div>
      <span class="lab">${k}</span></div>`;
  }).join('');
  document.getElementById('rep-dist-note').textContent =
    hotKey==='저녁' ? '해질 무렵(석양 시간대)에 기록이 몰려 있어요. 이 시간대 전에 조명을 켜두거나 좋아하는 활동을 준비해보세요.'
                    : `${hotKey} 시간대에 기록이 가장 많아요.`;
}

/* ================= 공유용 요약 ================= */
function openShare(){
  const bCounts = count(records.flatMap(r=>r.b)).slice(0,4);
  const c1Stats = {};
  records.forEach(r=>r.c1.forEach(c=>{
    c1Stats[c]=c1Stats[c]||{t:0,g:0}; c1Stats[c].t++;
    if(GOOD_RESULTS.includes(r.c2)) c1Stats[c].g++;
  }));
  const eff = Object.entries(c1Stats).filter(([,s])=>s.g>0).sort((a,b)=>b[1].g-a[1].g).slice(0,3);
  const conds = count(records.flatMap(r=>r.cond));
  const badDays = records.filter(r=>['더 심해짐·역효과','계속됨·변화 없음','일시적으로 진정 후 재발'].includes(r.c2));
  document.getElementById('share-paper').innerHTML = `
    <div class="p-head"><h2>행동심리증상 관찰 요약</h2>
    <span>기간 2026.08.06 – 08.12 · 총 ${records.length}건 · ABC 구조 기록</span></div>
    <div class="p-sec"><h5>주요 증상 빈도 (B)</h5><ul>
      ${bCounts.map(e=>`<li>${e[0]} — ${e[1]}회</li>`).join('')}</ul></div>
    <div class="p-sec"><h5>주요 선행 상황 (A)</h5><ul>
      ${count(records.flatMap(r=>r.a)).slice(0,3).map(e=>`<li>${e[0]} — ${e[1]}회</li>`).join('')}</ul></div>
    <div class="p-sec"><h5>효과적이었던 대응 (C)</h5><ul>
      ${eff.map(e=>`<li>${e[0]} — 진정 ${e[1].g}/${e[1].t}회</li>`).join('')}</ul></div>
    <div class="p-sec"><h5>대응이 어려웠던 상황</h5><ul>
      ${badDays.slice(0,3).map(r=>`<li>${r.date.slice(5).replace('-','.')} ${r.b[0]} → ${r.c1[0]} → ${r.c2}</li>`).join('')}</ul></div>
    <div class="p-sec"><h5>컨디션 특이사항</h5><ul>
      ${conds.length?conds.map(e=>`<li>${e[0]} — ${e[1]}일 관찰</li>`).join(''):'<li>특이사항 없음</li>'}</ul></div>
    <div class="p-foot">본 요약은 보호자가 ABC 행동분석 구조(선행사건–행동–대응·결과)로 기록한 일상 관찰 자료입니다. 진료 및 돌봄 기관 상담 시 참고용으로 활용해 주세요.</div>`;
  document.getElementById('share').classList.remove('hidden');
}
function closeShare(){ document.getElementById('share').classList.add('hidden'); }

/* ================= 기록 플로우 ================= */
const STEPS = ['B','A','C1','C2','TAG','DONE'];
const STEP_META = {
  B:{label:'B 행동', q:'방금, 어떤 <em>행동</em>이 있었나요?', hint:'관찰한 사실을 그대로 골라주세요. 여러 개 선택할 수 있어요.'},
  A:{label:'A 상황', q:'행동 <em>직전</em>, 어떤 상황이었나요?', hint:'기억나는 만큼만 괜찮아요. 모르면 "잘 모르겠어요"를 눌러주세요.'},
  C1:{label:'C 대응', q:'그때 <em>어떻게</em> 하셨나요?', hint:'실제로 한 행동을 골라주세요. 못 했어도 그것 역시 소중한 기록이에요.'},
  C2:{label:'C 결과', q:'대응 후, <em>어떻게</em> 되었나요?', hint:'하나만 골라주세요.'},
  TAG:{label:'마무리', q:'마지막으로, <em>오늘</em>을 남겨요', hint:'모두 선택 사항이에요. 건너뛰어도 괜찮아요.'}
};
let flow = null;

function startFlow(){
  flow = {step:0, b:[], a:[], c1:[], c2:null, calm:null, cond:[], me:null, expanded:{}};
  document.getElementById('flow').classList.remove('hidden');
  renderStep();
}
function closeFlow(){
  document.getElementById('flow').classList.add('hidden');
  flow = null;
}
function renderStep(){
  const key = STEPS[flow.step];
  if(key==='DONE'){ renderDone(); return; }
  const meta = STEP_META[key];
  document.getElementById('flow-steps').innerHTML = ['B','A','C1','C2','TAG'].map((s,i)=>{
    const cls = i===flow.step?'now':(i<flow.step?'done':'');
    return `<span class="step-dot ${cls}">${STEP_META[s].label}</span>`;
  }).join('');
  document.getElementById('flow-q').innerHTML = meta.q;
  document.getElementById('flow-hint').textContent = meta.hint;
  document.getElementById('btn-back').style.display = flow.step===0 ? 'none':'block';
  document.getElementById('btn-next').textContent = key==='TAG' ? '저장하기' : '다음';
  document.getElementById('flow-foot').style.display = 'flex';

  const body = document.getElementById('flow-body');
  if(key==='B') body.innerHTML = catsHTML(B_CATS, 'b');
  if(key==='A') body.innerHTML = alwaysChip(A_ALWAYS, 'a') + catsHTML(A_CATS, 'a');
  if(key==='C1') body.innerHTML = alwaysChip(C1_ALWAYS, 'c1') + catsHTML(C1_CATS, 'c1');
  if(key==='C2') body.innerHTML = c2HTML();
  if(key==='TAG') body.innerHTML = tagHTML();
  body.scrollTop = 0;
  updateNext();
}
function alwaysChip(label, field){
  const sel = flow[field].includes(label);
  return `<div class="cat"><div class="chips">
    <button class="chip always${sel?' sel':''}" onclick="toggleMulti('${field}', this.dataset.k)" data-k="${label}">✔ ${label}</button>
  </div></div>`;
}
function catsHTML(cats, field){
  return cats.map((cat,ci)=>{
    const key = field+ci;
    const expanded = flow.expanded[key];
    const shown = expanded ? cat.items : cat.items.slice(0,4);
    const rest = cat.items.length - 4;
    return `<div class="cat"><div class="cat-name">${cat.name}</div><div class="chips">
      ${shown.map(it=>chipBtn(field, it)).join('')}
      ${rest>0 ? `<button class="chip more" onclick="toggleExpand('${key}')">${expanded?'접기':'더보기 +'+rest}</button>`:''}
    </div></div>`;
  }).join('');
}
function chipBtn(field, item){
  const sel = flow[field].includes(item);
  return `<button class="chip${sel?' sel':''}" data-k="${item.replace(/"/g,'&quot;')}" onclick="toggleMulti('${field}', this.dataset.k)">${item}</button>`;
}
function toggleExpand(key){
  flow.expanded[key] = !flow.expanded[key];
  renderStep();
}
function toggleMulti(field, item){
  const arr = flow[field];
  const i = arr.indexOf(item);
  if(i>=0) arr.splice(i,1); else arr.push(item);
  renderStep();
}
function c2HTML(){
  return `<div class="single-note">가장 가까운 것 하나를 골라주세요.</div>
  <div class="chips">${C2_RESULTS.map(r=>`
    <button class="chip${flow.c2===r?' sel':''}" data-k="${r}" onclick="pick('c2', this.dataset.k)">${r}</button>`).join('')}</div>
  <div class="calm-block"><div class="calm-title">진정까지 걸린 시간</div>
  <div class="chips">${CALM_TIMES.map(t=>`
    <button class="chip dusk${flow.calm===t?' sel':''}" data-k="${t}" onclick="pick('calm', this.dataset.k)">${t}</button>`).join('')}</div></div>`;
}
function pick(field, v){
  flow[field] = flow[field]===v ? null : v;
  renderStep();
}
function tagHTML(){
  return `
  <div class="tag-sec"><h4>오늘 아버지 컨디션 <span class="opt-skip">(선택 · 복수 가능)</span></h4>
    <p>행동과는 별개로, 오늘 눈에 띈 몸 상태를 남겨두면 패턴 분석에 도움이 돼요.</p>
    <div class="chips">${COND_TAGS.map(t=>chipBtn('cond', t)).join('')}</div></div>
  <div class="tag-sec"><h4>오늘 나는 <span class="opt-skip">(선택)</span></h4>
    <p>돌보는 나의 상태도 기록의 일부예요.</p>
    <div class="chips">${ME_STATES.map(m=>`
      <button class="chip dusk${flow.me===m?' sel':''}" data-k="${m}" onclick="pick('me', this.dataset.k)">${m}</button>`).join('')}</div></div>`;
}
function updateNext(){
  const key = STEPS[flow.step];
  let ok = true;
  if(key==='B') ok = flow.b.length>0;
  if(key==='A') ok = flow.a.length>0;
  if(key==='C1') ok = flow.c1.length>0;
  if(key==='C2') ok = !!flow.c2 && !!flow.calm;
  document.getElementById('btn-next').disabled = !ok;
}
function nextStep(){
  const key = STEPS[flow.step];
  if(key==='TAG'){ saveRecord(); return; }
  flow.step++;
  renderStep();
}
function prevStep(){
  if(flow.step>0){ flow.step--; renderStep(); }
}
function saveRecord(){
  const now = new Date();
  const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  records.push({id:nextId++, date:TODAY, day:'수', time:t,
    b:[...flow.b], a:[...flow.a], c1:[...flow.c1], c2:flow.c2, calm:flow.calm,
    cond:[...flow.cond], me:flow.me||''});
  flow.step = STEPS.indexOf('DONE');
  renderStep();
}
function renderDone(){
  document.getElementById('flow-steps').innerHTML = '';
  document.getElementById('flow-q').innerHTML = '';
  document.getElementById('flow-hint').textContent = '';
  document.getElementById('flow-foot').style.display = 'none';
  const saved = records[records.length-1];
  document.getElementById('flow-body').innerHTML = `
  <div class="done-wrap">
    <div class="done-mark">🌿</div>
    <div class="done-title">기록하셨어요</div>
    <div class="done-msg">이 기록이 쌓여 패턴이 됩니다.<br>패턴을 알면, 다음엔 조금 덜 놀라게 돼요.</div>
    <div class="done-chips">
      <span class="mini-chip">${saved.b[0]}${saved.b.length>1?' 외 '+(saved.b.length-1):''}</span>
      <span class="mini-chip">${saved.c2}</span>
      ${saved.me?`<span class="mini-chip me">오늘 나는 · ${saved.me}</span>`:''}
    </div>
    <button class="btn btn-primary" style="flex:none;width:200px;" onclick="closeFlow(); showView('home');">홈으로</button>
  </div>`;
}

/* init */
renderHome();
</script>
</body>
