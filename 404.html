<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 — 돌봄온길</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg,#12263D 0%,#1B3A5C 60%,#1F4A37 100%);
    color:#fff; font-family:'Noto Sans KR',sans-serif; line-height:1.7; padding:24px; text-align:center;
  }
  .box{max-width:520px;}
  .serif{font-family:'Noto Serif KR',serif;}
  .code{font-size:64px; font-weight:900; color:#EFC98A; letter-spacing:.05em;}
  h1{font-size:26px; font-weight:900; margin-top:12px;}
  p{color:#D8E1E9; font-size:16px; margin-top:16px;}
  a.home{
    display:inline-block; margin-top:32px; padding:14px 30px; background:#C9922F; color:#fff;
    border-radius:4px; text-decoration:none; font-size:16px; font-weight:700;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  a.home:hover{background:#b5821f;}
</style>
</head>
<body>
  <div class="box">
    <div class="code serif">404</div>
    <h1 class="serif">길이 잠시 어긋났어요</h1>
    <p>찾으시는 페이지가 없거나 주소가 바뀌었어요.<br>돌봄온길 첫 화면에서 다시 길을 안내해 드릴게요.</p>
    <a class="home" href="/">돌봄온길 처음으로 →</a>
  </div>
</body>
</html>
